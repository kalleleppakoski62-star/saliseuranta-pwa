    const subtitle=mode==='feet'?'Jalkatuen subjektiivinen taso (ylöspäin = vähemmän apua)':mode==='machine'?'Laitteen avustus (kg): alempi on vähemmän apua':'Puhtaan sarjan toistot';
    return `<div class="chart-shell pullup-chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${subtitle}">${guides}${entries.length>1?`<polyline points="${pts}" fill="none" stroke="#c6fa7a" stroke-width="3" stroke-linejoin="round"/>`:''}${dots}<text x="${L}" y="${H-7}" fill="#a1b7b6" font-size="11">${formatDate(entries[0].date)}</text><text x="${W-R}" y="${H-7}" fill="#a1b7b6" font-size="11" text-anchor="end">${formatDate(entries.at(-1).date)}</text></svg><div class="inlinehint">${subtitle}</div></div>`;
  }
  function pullupPage(){
    const data=pullupEntries(),strict=pullupMilestone(),latest=data.at(-1),foot=data.filter(p=>p.mode==='feet'&&PULL_LEVELS[p.level]);
    const reached=new Set(foot.map(p=>p.level));
    return `${page('Leuanvedon kehitys','Erillinen etenemisseuranta C-harjoituksen yhteydessä tai omalle leuanvetoharjoitukselle. Lähtötaso voi olla 0 puhdasta toistoa.')}
    <div class="stats"><div class="stat"><label>Puhtaat leuat</label><div class="value">${strict?Math.max(...data.filter(p=>p.mode==='free').map(p=>p.reps)):0}</div><div class="sub">Paras kirjattu sarja</div></div><div class="stat"><label>Seurantakirjaukset</label><div class="value">${data.length}</div><div class="sub">Myös C-treenien sarjat</div></div><div class="stat"><label>Ensimmäinen puhdas</label><div class="value" style="font-size:19px">${strict?formatDate(strict.date):'Odottaa'}</div><div class="sub">Ei aikarajaa</div></div></div>
    <div class="section-head"><h2>Jalkatuen vähentäminen</h2><small>Ei kg-asteikko</small></div><div class="card"><div class="pullup-ladder">${[['strong','Runsas','Jalkatuki'],['medium','Kohtal.','Jalkatuki'],['light','Kevyt','Jalkatuki'],['free','1. puhdas','Ilman apua']].map(([id,label,sub])=>`<div class="pullup-stage ${id==='free'?strict?'active':'':reached.has(id)?'active':''}"><strong>${id==='free'&&strict?'✓ ':''}${label}</strong><small>${sub}</small></div>`).join('')}</div><p class="note">Merkkivalo näyttää saavutetut tasot, ei tasojen välisiä mitattuja voimakkuuseroja. Siirry kevyempään jalkatukeen vasta, kun kahdessa harjoituksessa onnistuu 2 × 6 hallittua toistoa samalla tuella. Vapaa leuka on oma merkkipaalunsa.</p>${strict?`<div class="hintbar"><strong>Merkkipaalu saavutettu ${formatDate(strict.date)}!</strong> Ensimmäinen puhdas leuanveto on tallennettu.</div>`:'<div class="hintbar">Ensimmäistä puhdasta leukaa ei tarvitse yrittää joka treenissä. Jatka avustettuja toistoja ja vähennä apua rauhallisesti.</div>'}</div>
    <div class="section-head"><h2>Avustuksen kehityskäyrä</h2></div><div class="card"><div class="seg">${[['feet','Jalkatuki'],['machine','Laite'],['band','Nauha'],['free','Puhtaat']].map(([id,label])=>`<button data-action="pullup-mode" data-mode="${id}" class="${pullupChartMode===id?'active':''}">${label}</button>`).join('')}</div>${pullupChart(pullupChartMode,data)}<p class="note">Vertaile saman avustustavan, liikeradan ja samankaltaisen toistomäärän kirjauksia. Jalkatuki on oma arvio eikä suoraan vertailukelpoinen kuminauhan tai laitteen kanssa.</p></div>
    <div class="section-head"><h2>Kirjaa leuanvetoharjoitus</h2></div><div class="card"><div class="grid2"><div class="field"><label for="pu-date">Päivä</label><input id="pu-date" type="date" value="${nowISO()}" max="${nowISO()}"></div><div class="field"><label for="pu-method">Avustustapa</label><select id="pu-method">${Object.entries(PULL_METHODS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div></div>
      <div class="aid-fields" data-pu-method="feet"><div class="field" style="grid-column:1/-1"><label for="pu-level">Jalkatuen määrä</label><select id="pu-level">${Object.entries(PULL_LEVELS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div></div>
      <div class="aid-fields" data-pu-method="machine" hidden><div class="field" style="grid-column:1/-1"><label for="pu-kg">Laitteen avustus (kg)</label><input id="pu-kg" type="number" inputmode="decimal" min="0.5" max="200" step="0.5" placeholder="esim. 45"></div></div>
      <div class="aid-fields" data-pu-method="band" hidden><div class="field" style="grid-column:1/-1"><label for="pu-band">Kuminauhan väri / malli / vahvuus</label><input id="pu-band" maxlength="60" placeholder="esim. sininen 25–35 kg"></div></div>
      <div class="aid-fields" data-pu-method="free" hidden><div class="field" style="grid-column:1/-1"><label style="display:flex;align-items:center;gap:10px"><input id="pu-free-confirm" type="checkbox" style="width:19px;min-height:19px"> Vahvistan, että kirjatut toistot ovat puhtaita ja ilman avustusta</label></div></div>
      <div class="grid2" style="margin-top:9px"><div class="field"><label for="pu-sets">Tehdyt sarjat</label><input id="pu-sets" type="number" inputmode="numeric" min="1" max="10" step="1" value="2"></div><div class="field"><label for="pu-reps">Paras sarja (toistoa)</label><input id="pu-reps" type="number" inputmode="numeric" min="0" max="30" step="1" placeholder="esim. 4"></div></div>
      <div class="field" style="margin-top:10px"><label for="pu-note">Muistiinpano (valinnainen)</label><textarea id="pu-note" maxlength="500" placeholder="Esim. sama koroke kuin viimeksi, jalat vain kevyesti tukena"></textarea></div>
      <button class="btn block" data-action="save-pullup" style="margin-top:12px">Tallenna leuanvetomerkintä</button><p class="note">Jos merkitset avustuksen jo C-harjoituksen leuanvetoliikkeeseen, älä kirjaa sitä uudestaan tässä. C:n valmiit sarjat näkyvät automaattisesti historiassa.</p></div>
    <div class="section-head"><h2>Leuanvetohistoria</h2><small>${data.length} merkintää</small></div><div class="card">${data.length?data.slice().reverse().slice(0,60).map(p=>`<div class="pullup-session"><div class="row" style="align-items:start"><div><strong>${formatDate(p.date)} · ${esc(PULL_METHODS[p.mode]||'Leuanveto')}</strong><div class="detail">${esc(pullupAidLabel(p))}</div><div class="small">${p.sets} sarjaa · paras ${p.reps} toistoa</div>${p.note?`<p class="note" style="margin:5px 0">${esc(p.note)}</p>`:''}</div><div>${p.source==='separate'?`<button class="btn ghost small-btn" data-action="delete-pullup" data-id="${esc(p.id)}">Poista</button>`:`<button class="btn secondary small-btn" data-action="edit-workout" data-id="${esc(p.workoutId)}">Avaa treeni</button>`}</div></div></div>`).join(''):'<div class="chart-empty">Ei vielä merkintöjä. Aloita rauhallisilla, jaloilla avustetuilla sarjoilla.</div>'}</div>
    <div class="section-head"><h2>Turvallinen eteneminen</h2></div><div class="card"><p class="note" style="margin:0">Tee avustettuja leuanvetoja 1–2 kertaa viikossa osana kokonaisohjelmaa, yleensä 2 × 3–6 rauhallista toistoa. Säilytä 2–4 toistoa varastossa ja käytä tukevaa koroketta sekä turvallisesti kiinnitettyä tankoa. Jos kyynärpää tai olkapää kipeytyy, kevennä ja vaihda tarvittaessa ylätaljaan. Kehonpainon lasku auttaa suhteellista voimaa, mutta ensimmäiselle puhtaalle leualle ei aseteta päivämäärää.</p><button class="btn secondary small-btn" style="margin-top:12px" data-action="open-optional">Avaa C-harjoitus →</button></div>`;
  }
  function savePullup(){
    const date=$('#pu-date').value,mode=$('#pu-method').value,sets=numeric($('#pu-sets').value),reps=numeric($('#pu-reps').value);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date>nowISO()||!PULL_METHODS[mode]||!Number.isInteger(sets)||sets<1||sets>10||!Number.isInteger(reps)||reps<0||reps>30){notify('Tarkista päivä, sarjat ja toistot');return}
    if(mode!=='free'&&reps===0){notify('Kirjaa avustettuja toistoja vähintään yksi');return}
    const level=$('#pu-level').value,kg=numeric($('#pu-kg').value),band=$('#pu-band').value.trim().slice(0,60);
    if(mode==='feet'&&!PULL_LEVELS[level]){notify('Valitse jalkatuki');return}
    if(mode==='machine'&&(kg===null||kg<=0||kg>200)){notify('Laitteen avustuksen pitää olla 0,5–200 kg');return}
    if(mode==='band'&&!band){notify('Kirjaa kuminauhan väri tai malli');return}
    if(mode==='free'&&reps>0&&!$('#pu-free-confirm').checked){notify('Vahvista puhtaan leuanvedon suoritustapa');return}
    const note=$('#pu-note').value.trim().slice(0,500);
    db.pullups.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),date,mode,level:mode==='feet'?level:null,kg:mode==='machine'?kg:null,band:mode==='band'?band:'',sets,reps,note});
    if(!persist())return;render();notify('Leuanvetomerkintä tallennettu');
  }

  function gym(){let w=weekly();const intro=`${page('Harjoitukset','Kaksi päätreeniä (A/B) ja yksi vapaaehtoinen kehonpainotreeni (C). Merkitse toteutuneet sarjat tehdyiksi.')}`;
    if(!db.draft&&templateEdit)return templateEditor();
    if(!db.draft){return intro+`<div class="btn-row" style="margin-bottom:12px"><button class="btn secondary block" data-action="template-start">✎ Muokkaa harjoituksen ${selectedPlan} liikkeitä</button></div><div class="card"><div class="eyebrow">Valitse päivän harjoitus</div><div class="seg" style="margin:10px 0 15px"><button class="${selectedPlan==='A'?'active':''}" data-action="plan" data-plan="A">Harjoitus A</button><button class="${selectedPlan==='B'?'active':''}" data-action="plan" data-plan="B">Harjoitus B</button><button class="${selectedPlan==='C'?'active':''}" data-action="plan" data-plan="C">C · Vapaaehtoinen</button></div>
      <div class="row"><div><h2 style="margin:0 0 5px;font-size:18px">${planTitle(selectedPlan)}</h2><div class="detail">${db.templates[selectedPlan].length} liikettä · ${db.templates[selectedPlan].reduce((s,e)=>s+Number(e.sets||0),0)} työsarjaa</div></div><span class="pill">${selectedPlan==='C'?'Vapaaehtoinen':'Koko vartalo'}</span></div><div class="divider"></div>
      ${db.templates[selectedPlan].map((e,i)=>`<div class="row" style="padding:7px 0"><div><strong>${i+1}. ${esc(e.name)}</strong><div class="detail">${e.sets} × ${esc(e.reps)} · ${calisMode(e,selectedPlan)?(e.name==='Leuanveto jalat tuettuina'?'jalat tuettuina / avustettuna':'kehonpaino'):'lähtöpaino '+fmt(getSuggestKg(e.name,e.kg))+' kg'}</div></div></div>`).join('')}
      ${selectedPlan==='C'?`<div class="notice"><strong>Helpotettu kehonpainotreeni · noin 25–35 min</strong><p class="note" style="margin:8px 0">Lämmittele 5 min. Lepää 60–90 s sarjojen välissä ja jätä 2–4 toistoa varastoon. Tee 0–1 kertaa viikossa vain, jos olet palautunut. Älä laske tätä kahden pääsalitreenin tavoitteeseen.</p><strong>Leuanvetoon eteneminen</strong><p class="note" style="margin:6px 0">0 puhdasta leukaa on täysin sopiva lähtötaso. Aloita niin vahvalla jalkatuella, että pystyt tekemään 3–6 hallittua toistoa. Lisää vähitellen toistoja, ja vähennä jalkojen apua vasta sitten. Vapaata leukaa ei tarvitse testata nyt.</p></div>`:''}
      <button class="btn block" style="margin-top:15px" data-action="start-workout">Aloita harjoitus ${selectedPlan} →</button><button class="btn secondary block" style="margin-top:9px" data-action="open-pullups">Leuanvedon progressioseuranta →</button>
      <div class="hintbar">${selectedPlan==='C'?'Kirjaa toistot ja määritä leuanvetoliikkeen avustustapa omassa kentässään. Käytä vain turvallisesti kiinnitettyä tankoa ja tukevaa jalkakoroketta.':'Liikkeenvaihdossa näytetään vain saman lihasryhmän ja liikemallin vaihtoehdot. Painot ehdotetaan edellisen kirjatun harjoituksen perusteella. Tee lämmittelysarjat erikseen ja pidä työsarjoissa noin 1–3 toistoa varastossa.'}</div></div>`+gymHistory();}
    const d=db.draft;let total=d.exercises.reduce((a,e)=>a+e.sets.length,0),done=completedSets(d);
    return intro+`<div class="card"><div class="row"><div><div class="eyebrow">Käynnissä · harjoitus ${d.plan}</div><h2 style="margin:0;font-size:20px">${planTitle(d.plan)}</h2></div><span class="pill">${done} / ${total} sarjaa</span></div><div class="progress"><div style="width:${percent(done,total)}%"></div></div><div class="field" style="max-width:230px;margin-top:12px"><label for="workdate">Harjoituspäivä</label><input id="workdate" type="date" value="${d.date}" max="${nowISO()}"></div>
    <div class="row" style="margin-top:13px"><div class="field"><label for="rest-default">Palautusaika sarjan jälkeen</label><select id="rest-default" data-rest-seconds="1">${[60,90,120,150,180,240].map(n=>`<option value="${n}" ${Number(db.settings.restSeconds||120)===n?'selected':''}>${n<60?n+' s':fmt(n/60,1)+' min'}</option>`).join('')}</select></div><button class="btn secondary small-btn" data-action="timer-start">${icon('clock')} Käynnistä ajastin</button></div>
    <div class="divider"></div>${d.exercises.map((e,i)=>`<section class="exercise"><div class="exercise-head"><div><div class="exercise-title">${i+1}. ${esc(e.name)}</div><div class="exercise-sub">Tavoite: ${e.sets.length} × ${esc(e.repsTarget)} · ${calisMode(e,d.plan)?'2–4':'1–3'} toistoa varastoon</div>${roleMark(e,d.plan,i)}${BW_INFO[e.name]?`<div class="inlinehint">${BW_INFO[e.name]}</div>`:''}</div><div class="btn-row"><button class="btn ghost small-btn" data-action="draft-replace-start" data-ex="${i}">Vaihda</button><button class="btn ghost small-btn" data-action="draft-remove" data-ex="${i}">Poista</button></div></div>
      ${isPullup(e)&&calisMode(e,d.plan)?pullupAidEditor(e,i):''}
      ${priorHint(e.name)}${(()=>{const r=progression(e.name,e.repsTarget,calisMode(e,d.plan));return `<div class="insight ${r.status==='down'?'amber':r.status==='first'?'blue':''}"><div class="row" style="align-items:start"><div><strong>${r.status==='up'?'↑ Kokeile lisätä kuormaa':r.status==='down'?'↓ Harkitse kevennystä':r.status==='hold'?'→ Säilytä nykyinen kuorma':'Harjoitussuositus'}</strong><div class="detail">${esc(r.text)}</div></div>${r.kg!==null?`<button class="btn secondary small-btn" data-action="apply-load" data-ex="${i}" data-kg="${r.kg}">Käytä ${fmt(r.kg)} kg</button>`:''}</div></div>`})()}<div class="btn-row" style="margin:0 0 9px"><button class="btn secondary small-btn" data-action="copy-previous" data-ex="${i}" ${previousExercise(e.name)?'':'disabled'}>Kopioi edelliset sarjat</button></div>
      ${draftReplaceIndex===i?`<div class="notice"><strong>Korvaa liike</strong><div class="field" style="margin-top:8px"><label>Suositellut saman roolin vaihtoehdot</label>${roleSelector('draft-swap-choice',e,d.plan,i,d.exercises.filter((_,j)=>j!==i).map(x=>x.name))}</div><div class="field" style="margin-top:8px"><label>Tai oma vastaava liike</label><input id="draft-swap-custom" maxlength="80" placeholder="Liikkeen nimi"></div><div class="btn-row" style="margin-top:9px"><button class="btn small-btn" data-action="draft-replace-apply" data-ex="${i}">Vaihda liike</button><button class="btn ghost small-btn" data-action="draft-replace-cancel">Peruuta</button></div></div>`:''}

      ${e.sets.map((s,j)=>`<div class="set-row ${s.done?'done':''} ${calisMode(e,d.plan)?'bw-row':''}"><div class="set-number">${j+1}</div>${calisMode(e,d.plan)?'':`<input type="number" inputmode="decimal" min="0" max="1000" step="0.5" aria-label="${esc(e.name)} sarja ${j+1}, kilogrammat" data-field="kg" data-ex="${i}" data-set="${j}" value="${s.kg??''}">`}<input type="number" inputmode="numeric" min="0" max="100" step="1" aria-label="${esc(e.name)} sarja ${j+1}, toistot" data-field="reps" data-ex="${i}" data-set="${j}" value="${s.reps??''}" placeholder="kpl"><button class="done-btn ${s.done?'done':''}" data-action="toggle-set" data-ex="${i}" data-set="${j}" aria-label="${s.done?'Merkitse tekemättömäksi':'Merkitse tehdyksi'}">✓</button>${j>0&&!s.done?`<button class="btn ghost repeat-btn" data-action="repeat-set" data-ex="${i}" data-set="${j}" title="Kopioi edellisen sarjan paino ja toistot sekä merkitse tehdyksi">= edellinen sarja ✓</button>`:''}</div>`).join('')}<div class="row" style="margin:12px 0 2px"><label class="detail" for="rir-${i}">RIR – montako toistoa jäi varastoon? (vapaaehtoinen)</label><select class="rir-input" id="rir-${i}" data-rir="${i}"><option value="" ${e.rir===null||e.rir===undefined?'selected':''}>Ei tietoa</option>${[0,1,2,3,4,5].map(n=>`<option value="${n}" ${e.rir===n?'selected':''}>${n}</option>`).join('')}</select></div>
      <div class="btn-row" style="margin-top:10px"><button class="btn ghost small-btn" data-action="draft-set-add" data-ex="${i}">+ Sarja</button><button class="btn ghost small-btn" data-action="draft-set-remove" data-ex="${i}">− Sarja</button></div></section>`).join('')}
    <div class="notice"><strong>Lisää liike tähän treeniin</strong><div class="field" style="margin-top:8px"><label>Lisää eri liike erillisenä harjoitukseen (ryhmitelty lihasryhmittäin)</label>${exerciseSelect('draft-add-choice')}</div><div class="field" style="margin-top:8px"><label>Tai kirjoita oma nimi</label><input id="draft-add-custom" maxlength="80" placeholder="Oman liikkeen nimi"></div><button class="btn secondary small-btn" style="margin-top:9px" data-action="draft-add">+ Lisää liike</button></div>
    ${programSummary(d.plan,d.exercises)}
    <div class="tips">Kopiointi esitäyttää sarjat, mutta ei merkitse niitä tehdyiksi. Vahvista jokainen toteutunut sarja ✓-painikkeella.</div><div class="field" style="margin-top:8px"><label for="worknote">Harjoituksen muistiinpanot</label><textarea id="worknote" placeholder="Esim. raskaus, palautuminen, tekniikka...">${esc(d.note||'')}</textarea></div><div class="btn-row" style="margin-top:15px"><button class="btn" data-action="finish-workout">Tallenna harjoitus</button><button class="btn ghost" data-action="discard-workout">Keskeytä</button></div><div class="note" style="margin-top:12px">Keskeneräiset sarjamerkinnät tallentuvat automaattisesti tähän selaimeen.</div></div>`;
  }
  function gymHistory(){let items=db.strength.slice().sort((a,b)=>(b.date+(b.savedAt||'')).localeCompare(a.date+(a.savedAt||''))).slice(0,8);return `<div class="section-head"><h2>Viimeisimmät salitreenit</h2></div><div class="card">${items.length?items.map(w=>{let n=completedSets(w);let total=w.exercises.reduce((a,e)=>a+e.sets.length,0);return `<div class="historyitem"><div class="row"><div><strong>${formatDate(w.date)} · ${workLabel(w.plan)}</strong><div class="meta">${n}/${total} sarjaa · ${w.exercises.filter(e=>e.sets.some(s=>s.done)).length} liikettä</div></div><button class="btn secondary small-btn" data-action="edit-workout" data-id="${esc(w.id)}">Avaa</button></div></div>`}).join(''):'<div class="empty">Ei vielä tallennettuja salitreenejä.</div>'}</div>`}
  function cardio(){let w=weekly();return `${page('Aerobinen liikunta','Pääpaino kävelyssä ja kevyessä peruskestävyysharjoittelussa. Aloita esimerkiksi 110–145 minuutista viikossa.')}
    <div class="stats" style="margin-bottom:13px"><div class="stat"><label>Viikon minuutit</label><div class="value">${fmt(w.minutes,0)}</div><div class="sub">tavoite ${db.settings.cardioTarget} min</div></div><div class="stat"><label>Harjoitukset</label><div class="value">${w.cardio.length}</div><div class="sub">tavoite 3</div></div><div class="stat"><label>Matka yhteensä</label><div class="value">${fmt(w.cardio.reduce((s,r)=>s+(r.distance||0),0))}</div><div class="sub">km, jos kirjattu</div></div></div>

  function cardioItem(c){return `<div class="historyitem"><div class="row"><div><strong>${esc(c.type)} · ${fmt(c.duration,0)} min</strong><div class="meta">${formatDate(c.date)} · ${esc(c.effort||'Kevyt')}${c.distance?` · ${fmt(c.distance)} km`:''}</div>${c.note?`<div class="note" style="margin-top:5px">${esc(c.note)}</div>`:''}</div><button class="btn ghost small-btn" data-action="delete-cardio" data-id="${esc(c.id)}">Poista</button></div></div>`}
  function more(){let entries=weightEntries();let nwork=db.strength.length,ncard=db.cardio.length;
    return `${page('Tavoitteet ja tiedot','Muokkaa lähtöarvoja ja varmista, että seuranta säilyy. Tiedot tallentuvat vain tähän selaimeen.')}
    <div class="card"><h2 style="font-size:18px;margin:0 0 16px">Omat tavoitteet</h2><div class="grid2">${labeled('ststart','Lähtöpaino (kg)',db.settings.startWeight,'min="30" max="350" step="0.1"')}${labeled('stgoal','Tavoitepaino (kg)',db.settings.goalWeight,'min="30" max="350" step="0.1"')}${labeled('stprotein','Proteiini (g / päivä)',db.settings.proteinTarget,'min="1" max="400" step="1"')}${labeled('stcalories','Kalorit (kcal / päivä)',db.settings.calorieTarget,'min="500" max="8000" step="50"')}${labeled('ststeps','Askeleet (päivä)',db.settings.stepsTarget,'min="100" max="50000" step="100"')}${labeled('stcardio','Aerobinen (min / viikko)',db.settings.cardioTarget,'min="10" max="1000" step="5"')}</div><button class="btn" style="margin-top:15px" data-action="save-settings">Tallenna tavoitteet</button><div class="hintbar">Alkupaino 95 kg on aiemmasta suunnitelmastasi otettu alustava arvo. Muokkaa se vastaamaan omaa seurannan lähtötilannettasi.</div></div>
    <div class="section-head"><h2>Vuorotyön ja palautumisen suunnittelu</h2></div><div class="card"><div class="row"><span class="detail">Merkitse tulevat työvuorot ja vireys. Suositukset eivät korvaa omaa palautumisarviota.</span><button class="btn secondary small-btn" data-action="tab" data-tab="planner">Avaa →</button></div></div><div class="section-head"><h2>Asenna ja säilytä tiedot</h2></div><div class="card"><h2 style="font-size:16px;margin:0 0 9px">Aloitusnäytölle ilman APK:ta</h2><p class="note">Julkaise PWA-paketti HTTPS-sivuna (esim. GitHub Pages). Avaa sivu Chromessa ja käytä <b>Asenna sovellus</b> tai selaimen <b>Lisää aloitusnäyttöön</b>. Päivitykset tulevat samasta verkko-osoitteesta ilman uutta APK:ta. Uusi julkaisu tarkistetaan automaattisesti sovelluksen avautuessa ja noin tunnin välein, jos selain sallii taustapäivitykset.</p><p class="detail" id="pwa-status">${location.protocol==='https:'?'PWA-päivitysten tarkistus käytettävissä':'Paikallinen HTML: PWA-asennus ja automaattiset päivitykset eivät ole käytössä'}</p><div class="btn-row"><button class="btn secondary small-btn" data-action="install-app">Asenna sovellus</button><button class="btn ghost small-btn" data-action="check-update">Tarkista päivitys</button></div><div class="divider"></div><div class="metric-list"><div class="metric-row"><strong>Viimeisin paikallinen tallennus</strong><strong>${db.meta?.lastSaved?new Date(db.meta.lastSaved).toLocaleString('fi-FI'):'Ei vielä merkintöjä'}</strong></div><div class="metric-row"><strong>Tiedot ovat</strong><strong>Tässä selaimessa</strong></div></div></div>
    <div class="section-head"><h2>Varmuuskopiointi</h2></div><div class="card"><p style="margin:0 0 13px;color:var(--muted)">Tiedot ovat tässä laitteessa ja sovelluksessa. Vie varmuuskopio säännöllisesti, etenkin ennen selaimen tietojen poistamista tai puhelimen vaihtoa.</p><div class="btn-row"><button class="btn" data-action="export-json">Lataa varmuuskopio (.json)</button><button class="btn secondary" data-action="import-json">Palauta varmuuskopio</button><button class="btn secondary" data-action="export-csv">Vie merkinnät (.csv)</button></div><div class="divider"></div><div class="metric-list"><div class="metric-row"><strong>Painomittaukset</strong><strong>${entries.length}</strong></div><div class="metric-row"><strong>Harjoitukset A/B/C</strong><strong>${nwork}</strong></div><div class="metric-row"><strong>Aerobiset harjoitukset</strong><strong>${ncard}</strong></div><div class="metric-row"><strong>Leuanvedon erilliskirjaukset</strong><strong>${db.pullups.length}</strong></div></div></div>
    <div class="notice">Päivitys 3.0 → 3.3: vanhojen A/B-harjoitusten ja päiväkirjan tietomalli säilyy. C-ohjelma, leuanvetoseuranta ja lihasryhmäkohtaiset liikevaihtoehdot toimivat samalla selainosoitteella. Jos avaat eri HTML-tiedoston tai julkaistun PWA:n, vie vanhasta versiosta JSON-varmuuskopio ja palauta se täällä.</div>
    <div class="section-head"><h2>Harjoitushistoria</h2></div><div class="card">${nwork?db.strength.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(w=>`<div class="historyitem"><div class="row"><div><strong>${formatDate(w.date)} · ${workLabel(w.plan)}</strong><div class="meta">${completedSets(w)} kirjattua sarjaa</div></div><div class="btn-row"><button class="btn secondary small-btn" data-action="edit-workout" data-id="${esc(w.id)}">Tarkastele / muokkaa</button><button class="btn ghost small-btn" data-action="delete-workout" data-id="${esc(w.id)}">Poista</button></div></div></div>`).join(''):'<div class="empty">Ei vielä tallennettuja harjoituksia.</div>'}</div>
    <div class="section-head"><h2>Tietosuoja ja käyttötapa</h2></div><div class="card"><p class="note" style="margin-top:0">Sovellus ei lähetä merkintöjä palvelimelle eikä vaadi kirjautumista. Selaimen paikallinen tallennustila voi tyhjentyä esimerkiksi selaintietojen poistossa, yksityisessä selaustilassa tai puhelimen vaihdossa. JSON-varmuuskopio on tärkeä.</p><button class="btn danger small-btn" data-action="clear-data">Poista kaikki tiedot</button></div>`}
  function render(){document.title='Saliseuranta 4.0';$('#todaylabel').textContent=new Date().toLocaleDateString('fi-FI',{weekday:'short',day:'numeric',month:'numeric'});nav();$('#app').innerHTML=({home,daily,gym,cardio,planner,more,pullup:pullupPage}[tab]||home)()}
  function changeTab(t){tab=t;templateEdit=false;render();window.scrollTo({top:0,behavior:'instant'})}
  function saveDay(){let fields=[['weight',30,350],['waist',30,220],['calories',0,12000],['protein',0,500],['steps',0,100000]];let day={...db.days[selectedDate]};for(let [name,min,max] of fields){let v=numeric($('#'+name).value);if(!validNum(v,min,max)){notify('Tarkista kenttä: '+name);return}day[name]=v}day.note=$('#daynote').value.trim().slice(0,4000);if(selectedDate>nowISO()){notify('Tulevaa päivää ei voi kirjata');return}db.days[selectedDate]=day;persist();notify('Päivämerkintä tallennettu');render()}
  function saveSettings(){let fields={startWeight:['ststart',30,350],goalWeight:['stgoal',30,350],proteinTarget:['stprotein',1,400],calorieTarget:['stcalories',500,8000],stepsTarget:['ststeps',100,50000],cardioTarget:['stcardio',10,1000]};let st={...db.settings};for(let [k,[id,min,max]] of Object.entries(fields)){let v=numeric($('#'+id).value);if(v===null||!validNum(v,min,max)){notify('Tarkista tavoitekentät');return}st[k]=v}if(st.goalWeight>=st.startWeight){if(!confirm('Tavoitepaino on vähintään lähtöpainon suuruinen. Tallennetaanko silti?'))return}db.settings=st;persist();notify('Tavoitteet tallennettu');render()}
  function saveCardio(){let date=$('#cdate').value,duration=numeric($('#cduration').value),distance=numeric($('#cdistance').value);if(!date||date>nowISO()||duration===null||duration<1||duration>1000||!validNum(distance,0,1000)){notify('Tarkista päivämäärä, kesto ja matka');return}
    db.cardio.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),date,type:$('#ctype').value,duration,distance,effort:$('#ceffort').value,note:$('#cnote').value.trim().slice(0,2000)});persist();notify('Aerobinen harjoitus tallennettu');render()}
  function saveWorkout(){let d=db.draft;if(!d)return;const n=completedSets(d);if(!n){notify('Kirjaa ja merkitse vähintään yksi sarja');return}if(d.date>nowISO()||!d.date){notify('Tarkista harjoituspäivä');return}let incomplete=d.exercises.reduce((a,e)=>a+e.sets.filter(s=>!s.done).length,0);if(incomplete&&!confirm(`${incomplete} sarjaa on merkitsemättä tehdyksi. Tallennetaanko ${n} toteutunutta sarjaa?`))return;
    d.savedAt=new Date().toISOString();let ix=db.strength.findIndex(w=>w.id===d.id);if(ix>=0)db.strength[ix]=structuredClone(d);else db.strength.push(structuredClone(d));db.draft=null;persist();notify('Saliharjoitus tallennettu');render()}
  function download(name,mime,contents){if(window.SalioAndroid&&typeof window.SalioAndroid.saveFile==='function'){window.SalioAndroid.saveFile(name,mime,contents);return}let blob=new Blob([mime.includes('text/csv')?'\ufeff':'',contents],{type:mime}),url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
  function csvRow(cells){return cells.map(s=>'"'+String(s??'').replaceAll('"','""')+'"').join(';')}
  function exportCSV(){let lines=[csvRow(['Tyyppi','Päivä','Alatyyppi','Mittari','Arvo','Yksikkö','Lisätieto'])];for(let [date,r] of Object.entries(db.days))for(let [key,unit] of [['weight','kg'],['waist','cm'],['calories','kcal'],['protein','g'],['steps','kpl']])if(Number.isFinite(r[key]))lines.push(csvRow(['Päiväkirja',date,'',key,r[key],unit,r.note||'']));
    for(let w of db.strength)for(let e of w.exercises)for(let i=0;i<e.sets.length;i++){let s=e.sets[i];if(s.done)lines.push(csvRow([w.plan==='C'?'Kehonpaino':'Sali',w.date,workLabel(w.plan),e.name,calisMode(e,w.plan)?s.reps:s.kg,calisMode(e,w.plan)?'toistoa':'kg',`Sarja ${i+1}: ${s.reps} toistoa${isPullup(e)&&e.pullupAid?' · '+pullupAidLabel(e.pullupAid):''}`]))}
    for(let pu of db.pullups)lines.push(csvRow(['Leuanveto',pu.date,PULL_METHODS[pu.mode]||pu.mode,'Paras sarja',pu.reps,'toistoa',`Sarjat ${pu.sets}; ${pullupAidLabel(pu)}; ${pu.note||''}`]));
    for(let c of db.cardio)lines.push(csvRow(['Aerobinen',c.date,c.type,'Kesto',c.duration,'min',`Matka ${c.distance??''} km · ${c.effort} · ${c.note||''}`]));
    for(const [date,item] of Object.entries(db.shifts||{}))lines.push(csvRow(['Työvuoro',date,item.shift||'', 'Vireys',item.energy||'normal','', 'Suunnittelumerkintä']));
    download('saliseuranta-merkinnat-'+nowISO()+'.csv','text/csv;charset=utf-8',lines.join('\r\n'));notify('CSV ladattu')}
  function validateImport(s){return s&&s.version===1&&s.days&&typeof s.days==='object'&&!Array.isArray(s.days)&&Array.isArray(s.strength)&&Array.isArray(s.cardio)&&s.settings&&typeof s.settings==='object'&&s.strength.length<50000&&s.cardio.length<50000&&(!s.pullups||(Array.isArray(s.pullups)&&s.pullups.length<50000))&&Object.keys(s.days).length<100000}
  function handleClick(e){const b=e.target.closest('[data-action]');if(!b)return;let action=b.dataset.action;
    if(action==='tab'){changeTab(b.dataset.tab);return}
    if(action==='planner-prev'){plannerWeek=Math.max(-8,plannerWeek-1);render();return}
    if(action==='planner-next'){plannerWeek=Math.min(12,plannerWeek+1);render();return}
    if(action==='apply-load'){let ex=db.draft?.exercises[Number(b.dataset.ex)],kg=numeric(b.dataset.kg);if(ex&&kg>0&&!calisMode(ex,db.draft.plan)){ex.sets.forEach(set=>{if(!set.done)set.kg=kg});persist();render();notify('Painosuositus esitäytetty – vahvista toteutuneet sarjat')}return}
    if(action==='timer-start'){startRest();return}
    if(action==='timer-extend'){restEnd=Math.max(Date.now(),restEnd)+30000;try{sessionStorage.setItem('saliseuranta_restEnd',String(restEnd))}catch{};tickRest();return}
    if(action==='timer-restart'){startRest();return}
    if(action==='timer-dismiss'){restEnd=0;try{sessionStorage.removeItem('saliseuranta_restEnd')}catch{};tickRest();return}
    if(action==='check-update'){if(pwaReg){pwaReg.update().then(()=>notify('Päivitysten tarkistus tehty')).catch(()=>notify('Verkkoyhteyttä ei saada'))}else notify('PWA-päivitykset vaativat julkaistun HTTPS-version');return}
    if(action==='apply-update'){if(db.draft&&!confirm('Käynnissä oleva treeni säilyy paikallisessa tallennuksessa. Ladataanko päivitetty sovellus?'))return;if(pendingPwaUpdate)pendingPwaUpdate.postMessage({type:'SKIP_WAITING'});else location.reload();return}
    if(action==='range'){chartRange=Number(b.dataset.days);render();return}
    if(action==='plot'){plotMetric=b.dataset.metric==='waist'?'waist':'weight';render();return}
    if(action==='plan'){selectedPlan=['A','B','C'].includes(b.dataset.plan)?b.dataset.plan:'A';templateEdit=false;render();return}
    if(action==='open-optional'){selectedPlan='C';changeTab('gym');return}
    if(action==='open-pullups'){changeTab('pullup');return}
    if(action==='pullup-mode'){pullupChartMode=['feet','machine','free','band'].includes(b.dataset.mode)?b.dataset.mode:'feet';render();return}
    if(action==='save-pullup'){savePullup();return}
    if(action==='delete-pullup'){if(confirm('Poistetaanko leuanvedon erilliskirjaus?')){db.pullups=db.pullups.filter(x=>x.id!==b.dataset.id);persist();render()}return}
    if(action==='today-date'){selectedDate=nowISO();render();return}
    if(action==='edit-day'){selectedDate=b.dataset.date;changeTab('daily');return}
    if(action==='save-day'){saveDay();return}
    if(action==='quick-weight'){let kg=numeric($('#quick-weight').value);if(kg===null||kg<30||kg>350){notify('Anna paino väliltä 30–350 kg');return}db.days[nowISO()]={...db.days[nowISO()],weight:kg};persist();render();notify('Paino kirjattu');return}
    if(action==='save-settings'){saveSettings();return}
    if(action==='save-cardio'){saveCardio();return}
    if(action==='delete-cardio'){if(confirm('Poistetaanko aerobinen harjoitus?')){db.cardio=db.cardio.filter(c=>c.id!==b.dataset.id);persist();render()}return}
    if(action==='template-start'){templateWorking=clone(db.templates[selectedPlan].map((e,i)=>normalizeTemplateItem(e,selectedPlan,i)));templateEdit=true;render();return}
    if(action==='template-cancel'){templateEdit=false;templateWorking=[];render();return}
    if(action==='template-save'){saveTemplate();return}
    if(action==='template-add'){if(templateWorking.length>=25){notify('Enintään 25 liikettä');return}templateWorking.push({name:'Uusi liike',sets:2,reps:'8–12',kg:0,slot:null});render();return}
    if(action==='template-remove'){if(templateWorking.length<=1){notify('Jätä vähintään yksi liike');return}templateWorking.splice(Number(b.dataset.ex),1);render();return}
    if(action==='template-up'||action==='template-down'){let i=Number(b.dataset.ex),j=i+(action==='template-up'?-1:1);if(j>=0&&j<templateWorking.length){[templateWorking[i],templateWorking[j]]=[templateWorking[j],templateWorking[i]];render()}return}
    if(action==='draft-replace-start'){draftReplaceIndex=Number(b.dataset.ex);render();return}
    if(action==='draft-replace-cancel'){draftReplaceIndex=null;render();return}
    if(action==='draft-replace-apply'){const name=($('#draft-swap-custom').value.trim()||$('#draft-swap-choice').value).slice(0,80);if(!name){notify('Valitse tai kirjoita liike');return}changeDraftExercise(Number(b.dataset.ex),name);return}
    if(action==='draft-add'){let name=($('#draft-add-custom').value.trim()||$('#draft-add-choice').value).slice(0,80);if(!name){notify('Valitse tai kirjoita liike');return}if(db.draft.exercises.length>=25){notify('Enintään 25 liikettä');return}let match=templateList().find(e=>e.name===name)||Object.values(PLANS).flat().find(e=>e.name===name);db.draft.exercises.push(draftExercise({...((match||{name,sets:2,reps:'8–12',kg:0,mode:db.draft.plan==='C'?'bodyweight':'weight'})),slot:inferRole(name,db.draft.plan,-1)},db.draft.plan));persist();render();return}
    if(action==='draft-remove'){let i=Number(b.dataset.ex),e=db.draft?.exercises[i];if(!e)return;if(e.sets.some(s=>s.done)&&!confirm('Tähän liikkeeseen on kirjattu sarjoja. Poistetaanko ne harjoituksesta?'))return;db.draft.exercises.splice(i,1);draftReplaceIndex=null;persist();render();return}
    if(action==='repeat-set'){let ex=db.draft?.exercises[Number(b.dataset.ex)],i=Number(b.dataset.set),before=ex?.sets[i-1],now=ex?.sets[i];if(!now||!before||!before.done){notify('Merkitse edellinen sarja ensin tehdyksi');return}now.kg=before.kg;now.reps=before.reps;now.done=true;persist();startRest();render();notify('Sarja kirjattu kuten edellinen');return}
    if(action==='copy-previous'){const exercise=db.draft?.exercises[Number(b.dataset.ex)],past=exercise&&previousExercise(exercise.name);if(!past){notify('Ei aiempia sarjoja');return}for(let j=0;j<Math.min(exercise.sets.length,past.sets.length);j++){if(!exercise.sets[j].done){exercise.sets[j].kg=past.sets[j].kg;exercise.sets[j].reps=past.sets[j].reps}}persist();render();notify('Edelliset sarjat esitäytetty. Vahvista toteutuneet sarjat.');return}
    if(action==='draft-set-add'){let e=db.draft?.exercises[Number(b.dataset.ex)];if(e&&e.sets.length<10){e.sets.push({kg:e.sets.at(-1)?.kg??0,reps:null,done:false});persist();render()}return}
    if(action==='draft-set-remove'){let e=db.draft?.exercises[Number(b.dataset.ex)];if(!e||e.sets.length<=1)return;if(e.sets.at(-1).done&&!confirm('Viimeinen sarja on jo tehty. Poistetaanko se?'))return;e.sets.pop();persist();render();return}
    if(action==='start-workout'){db.draft=newDraft(selectedPlan);persist();render();return}
    if(action==='toggle-set'){let s=db.draft?.exercises[Number(b.dataset.ex)]?.sets[Number(b.dataset.set)];if(!s)return;if(!s.done&&(!Number.isFinite(s.reps)||s.reps<1||(!calisMode(db.draft.exercises[Number(b.dataset.ex)],db.draft.plan)&&(s.kg===null||s.kg<=0)))){notify(calisMode(db.draft.exercises[Number(b.dataset.ex)],db.draft.plan)?'Syötä ensin toistot':'Syötä ensin kilot ja toistot');return}if(!s.done&&isPullup(db.draft.exercises[Number(b.dataset.ex)])&&calisMode(db.draft.exercises[Number(b.dataset.ex)],db.draft.plan)){const ex=db.draft.exercises[Number(b.dataset.ex)],aid=ex.pullupAid||defaultAid();if(aid.mode==='machine'&&!(Number(aid.kg)>0)){notify('Merkitse laitteen avustus kilogrammoina');return}if(aid.mode==='band'&&!String(aid.band||'').trim()){notify('Nimeä käytetty kuminauha vertailua varten');return}if(aid.mode==='free'&&!confirm('Vahvistatko, että toisto oli puhdas leuanveto ilman avustusta ja täydellä liikeradalla?'))return;}s.done=!s.done;persist();if(s.done)startRest();render();return}
    if(action==='finish-workout'){saveWorkout();return}
    if(action==='discard-workout'){if(confirm('Keskeytetäänkö harjoitus ja poistetaanko keskeneräiset sarjat?')){db.draft=null;persist();render()}return}
    if(action==='edit-workout'){if(db.draft&&!confirm('Keskeneräinen harjoitus korvataan valitulla historiakirjauksella. Jatketaanko?'))return;let w=db.strength.find(w=>w.id===b.dataset.id);if(w){db.draft=structuredClone(w);persist();changeTab('gym')}return}
    if(action==='delete-workout'){if(confirm('Poistetaanko tämä saliharjoitus pysyvästi?')){db.strength=db.strength.filter(w=>w.id!==b.dataset.id);persist();render()}return}
    if(action==='install-app'){if(deferredInstall){deferredInstall.prompt();deferredInstall=null}else alert('Avaa julkaistu HTTPS-versio Androidin Chromessa. Valitse Chromen valikosta Lisää aloitusnäyttöön / Asenna sovellus. Paikallinen HTML-tiedosto ei ole asennettava PWA.');return}
    if(action==='export-json'){download('saliseuranta-varmuuskopio-'+nowISO()+'.json','application/json;charset=utf-8',JSON.stringify(db,null,2));notify('Varmuuskopio ladattu');return}
    if(action==='export-csv'){exportCSV();return}
    if(action==='import-json'){$('#importfile').click();return}
    if(action==='clear-data'){if(confirm('Tämä poistaa KAIKKI kirjaukset ja tavoitteet tältä selaimelta. Varmuuskopio kannattaa tehdä ensin. Jatketaanko?')&&confirm('Vahvista vielä: poistetaanko kaikki seurannan tiedot?')){db=defaults();selectedDate=nowISO();persist();changeTab('home');notify('Tiedot poistettu')}return}
  }
  document.addEventListener('click',handleClick);
  document.addEventListener('change',e=>{if(e.target.dataset.shift){let date=e.target.dataset.date,field=e.target.dataset.shift;if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return;db.shifts[date]={...(db.shifts[date]||{}),[field]:e.target.value};persist();render();return}if(e.target.dataset.restSeconds){db.settings.restSeconds=Number(e.target.value)||120;persist();notify('Palautusaika tallennettu');return}if(e.target.dataset.rir!==undefined){let ex=db.draft?.exercises[Number(e.target.dataset.rir)];if(ex){ex.rir=e.target.value===''?null:Number(e.target.value);persist()}return}if(e.target.id==='pu-method'){document.querySelectorAll('[data-pu-method]').forEach(x=>x.hidden=x.dataset.puMethod!==e.target.value);return}if(e.target.dataset.pullAid==='mode'){const ex=db.draft?.exercises[Number(e.target.dataset.ex)];if(ex){ex.pullupAid={...defaultAid(),mode:e.target.value};persist();render()}return}if(e.target.dataset.pullAid){const ex=db.draft?.exercises[Number(e.target.dataset.ex)];if(ex){ex.pullupAid=ex.pullupAid||defaultAid();ex.pullupAid[e.target.dataset.pullAid]=e.target.dataset.pullAid==='kg'?numeric(e.target.value):e.target.value;persist()}return}if(e.target.id==='lift-choice'){selectedLift=e.target.value;render();return}if(e.target.id.startsWith('tc-')){const i=Number(e.target.id.slice(3));if(e.target.value&&templateWorking[i]){let ex=templateWorking[i];ex.slot=roleOf(ex,selectedPlan,i);ex.name=e.target.value;ex.kg=replacementLoad(e.target.value);ex.mode=selectedPlan==='C'?'bodyweight':'weight';render();notify('Liike vaihdettu; sarjat ja toistot säilyvät')}return}if(e.target.id==='daydate'){selectedDate=e.target.value;render()}if(e.target.id==='workdate'&&db.draft){db.draft.date=e.target.value;persist()}});
  document.addEventListener('input',e=>{let el=e.target;if(el.dataset.templateField!==undefined){let ex=templateWorking[Number(el.dataset.ex)];if(ex){let fld=el.dataset.templateField;ex[fld]=fld==='sets'||fld==='kg'?numeric(el.value):el.value}return}if(el.dataset.pullAid){const ex=db.draft?.exercises[Number(el.dataset.ex)];if(ex){ex.pullupAid=ex.pullupAid||defaultAid();ex.pullupAid[el.dataset.pullAid]=el.dataset.pullAid==='kg'?numeric(el.value):el.value;persist()}return}if(!db.draft)return;if(el.dataset.field&&el.dataset.ex!==undefined){const ex=db.draft.exercises[Number(el.dataset.ex)],set=ex?.sets[Number(el.dataset.set)];if(set){set[el.dataset.field]=numeric(el.value);if(el.dataset.field==='reps'&&set.reps!==null)set.reps=Math.trunc(set.reps);if(set.done&&(!set.reps||(!calisMode(ex,db.draft.plan)&&(set.kg===null||set.kg<=0))))set.done=false;persist()}}if(el.id==='worknote'){db.draft.note=el.value.slice(0,4000);persist()}});
  $('#importfile').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{if(file.size>20000000)throw Error('Tiedosto on liian suuri');let obj=JSON.parse((await file.text()).replace(/^\uFEFF/,''));if(!validateImport(obj))throw Error('Varmuuskopion rakenne ei kelpaa');if(!confirm('Palautus KORVAA tämän selaimen nykyiset seurantatiedot. Jatketaanko?'))return;db={...defaults(),...obj,templates:{...templatesDefault(),...(obj.templates||{})},settings:{...defaults().settings,...obj.settings},pullups:Array.isArray(obj.pullups)?obj.pullups:[],shifts:obj.shifts&&typeof obj.shifts==='object'&&!Array.isArray(obj.shifts)?obj.shifts:{}};persist();selectedDate=nowISO();changeTab('home');notify('Varmuuskopio palautettu')}catch(err){alert('Varmuuskopion palautus epäonnistui: '+err.message)}finally{e.target.value=''}});
  window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredInstall=event});
  function startRest(){restEnd=Date.now()+Math.max(30,Number(db.settings.restSeconds||120))*1000;try{sessionStorage.setItem('saliseuranta_restEnd',String(restEnd))}catch{};tickRest()}
  function tickRest(){let panel=$('#restpanel'),count=$('#restcount'),status=$('#rest_status');if(!panel)return;if(!restEnd){panel.hidden=true;return}panel.hidden=false;let seconds=Math.max(0,Math.ceil((restEnd-Date.now())/1000));count.textContent=Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');status.textContent=seconds>0?'Käynnissä':'Tauko valmis';count.style.color=seconds>0?'var(--green)':'var(--amber)'}
  setInterval(tickRest,1000);tickRest();
  // Service worker vastaa vain julkaistussa HTTPS-PWA:ssa (tai localhostissa).
  async function initPWA(){if(!('serviceWorker' in navigator)||!(location.protocol==='https:'||location.hostname==='localhost'))return;
    try{pwaReg=await navigator.serviceWorker.register('./sw.js');
      const consider=()=>{if(pwaReg.waiting&&navigator.serviceWorker.controller){pendingPwaUpdate=pwaReg.waiting;if(!db.draft){$('#updatebanner').hidden=true;pendingPwaUpdate.postMessage({type:'SKIP_WAITING'})}else $('#updatebanner').hidden=false;}};
      consider();pwaReg.addEventListener('updatefound',()=>{const worker=pwaReg.installing;if(worker)worker.addEventListener('statechange',()=>{if(worker.state==='installed')consider()})});
      navigator.serviceWorker.addEventListener('controllerchange',()=>{location.reload()});
      const check=()=>{if(navigator.onLine)pwaReg.update().catch(()=>{})};
      window.addEventListener('focus',check);setInterval(check,60*60*1000);check();
    }catch(err){console.warn('PWA rekisteröinti epäonnistui',err)}
  }
  initPWA();render();
  </script>
</body>
</html>
